[project]
name = "mojo-uuid"
version = "0.1.0"
description = "Pure Mojo UUID generation (v4 random, v7 time-ordered)"
authors = ["IDEA2CODE"]
channels = ["conda-forge", "modular"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
build = "mojo build src -o lib/mojo_uuid.mojopkg"
test = "mojo run tests/test_uuid.mojo"

[dependencies]
max = ">=24.6,<25"
